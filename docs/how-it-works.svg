<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d">
<title id="t">EvidencePack: prints e fotos viram um relatório em PDF</title><desc id="d">Arquivos soltos são organizados por atividade e viram um PDF com figuras numeradas, legendas e sumário.</desc>
<style>
:root{--bg:#eef0f6;--card:#fafbfd;--line:#cdd3e3;--ink:#111626;--mut:#575f7a;--bar:#c4cbe0;--acc:#2f4bd8;--accc:#ffffff;--mark:#dde3fb;--ok:#1f8a5b;--bad:#d1342a;--warn:#c98200}
@media (prefers-color-scheme:dark){:root{--bg:#0d1020;--card:#141a2d;--line:#2b3556;--ink:#e8ebf8;--mut:#97a0c4;--bar:#38426a;--acc:#8fa3ff;--accc:#0a0f2b;--mark:#222c5a;--ok:#4fcf9b;--bad:#ff8a80;--warn:#f2b84b}}
text{font-family:'Hanken Grotesk','Segoe UI',-apple-system,system-ui,sans-serif;fill:var(--ink)}
.mut{fill:var(--mut)}
.fo{transform-box:fill-box}

.cardin{animation:cin 9s infinite both}
.c2{animation-delay:.25s}.c3{animation-delay:.5s}.c4{animation-delay:.75s}
@keyframes cin{0%,6%{opacity:0;transform:translateY(14px)}14%,40%{opacity:1;transform:none}}
.fly{animation:fly 9s infinite both}
.f2{animation-delay:.25s}.f3{animation-delay:.5s}.f4{animation-delay:.75s}
@keyframes fly{0%,36%{opacity:0}40%{opacity:1}100%{opacity:1}}
.cap{animation:cap 9s infinite both}
@keyframes cap{0%,52%{opacity:0;transform:scaleX(0)}60%,90%{opacity:1;transform:scaleX(1)}97%,100%{opacity:0}}
.num{animation:num 9s infinite both}
@keyframes num{0%,56%{opacity:0}64%,90%{opacity:1}97%,100%{opacity:0}}
.badge{animation:badge 9s infinite both;transform-origin:center}
@keyframes badge{0%,66%{opacity:0;transform:scale(.6)}72%{opacity:1;transform:scale(1.12)}78%,90%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
.hide{animation:hide 9s infinite both}
@keyframes hide{0%,34%{opacity:1}42%,90%{opacity:0}97%,100%{opacity:0}}
.pg{animation:pg 9s infinite both}
@keyframes pg{0%,30%{opacity:.0;transform:translateX(24px)}40%,92%{opacity:1;transform:none}98%,100%{opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="960" height="320" rx="16" fill="var(--bg)"/>
<text x="40" y="52" font-size="13" font-weight="600" class="mut" letter-spacing=".8">ARQUIVOS</text><g class="cardin c1"><rect x="40" y="70" width="140" height="96" rx="10" fill="var(--card)" stroke="var(--line)"/><rect x="48" y="78" width="124" height="58" rx="6" fill="#2f4bd8" opacity=".85"/><path d="M56 130l24-24 18 16 14-10 36 22z" fill="#fff" opacity=".35"/><rect x="48" y="144" width="70" height="7" rx="3.5" fill="var(--bar)"/><rect x="48" y="155" width="40" height="5" rx="2.5" fill="var(--bar)" opacity=".6"/></g><g class="cardin c2"><rect x="192" y="70" width="140" height="96" rx="10" fill="var(--card)" stroke="var(--line)"/><rect x="200" y="78" width="124" height="58" rx="6" fill="#5b6ee1" opacity=".85"/><path d="M208 130l24-24 18 16 14-10 36 22z" fill="#fff" opacity=".35"/><rect x="200" y="144" width="70" height="7" rx="3.5" fill="var(--bar)"/><rect x="200" y="155" width="40" height="5" rx="2.5" fill="var(--bar)" opacity=".6"/></g><g class="cardin c3"><rect x="40" y="176" width="140" height="96" rx="10" fill="var(--card)" stroke="var(--line)"/><rect x="48" y="184" width="124" height="58" rx="6" fill="#8fa3ff" opacity=".85"/><path d="M56 236l24-24 18 16 14-10 36 22z" fill="#fff" opacity=".35"/><rect x="48" y="250" width="70" height="7" rx="3.5" fill="var(--bar)"/><rect x="48" y="261" width="40" height="5" rx="2.5" fill="var(--bar)" opacity=".6"/></g><g class="cardin c4"><rect x="192" y="176" width="140" height="96" rx="10" fill="var(--card)" stroke="var(--line)"/><rect x="200" y="184" width="124" height="58" rx="6" fill="#3b5bdb" opacity=".85"/><path d="M208 236l24-24 18 16 14-10 36 22z" fill="#fff" opacity=".35"/><rect x="200" y="250" width="70" height="7" rx="3.5" fill="var(--bar)"/><rect x="200" y="261" width="40" height="5" rx="2.5" fill="var(--bar)" opacity=".6"/></g><path d="M360 160h80m-12-9 12 9-12 9" fill="none" stroke="var(--mut)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><g class="pg"><rect x="470" y="26" width="270" height="272" rx="8" fill="#fff" stroke="var(--line)"/><rect x="490" y="46" width="120" height="10" rx="5" fill="var(--acc)"/><rect x="490" y="62" width="70" height="6" rx="3" fill="#c9cdd8"/><g class="fly f1"><rect x="490" y="84" width="108" height="64" rx="4" fill="#2f4bd8" opacity=".85"/><path d="M496 140l18-18 14 12 10-8 28 14z" fill="#fff" opacity=".35"/></g><text class="num" x="490" y="81" font-size="9" font-weight="700" style="fill:#555a6e">Figura 1</text><rect class="cap fo" x="490" y="156" width="100" height="5" rx="2.5" fill="#c9cdd8" style="transform-origin:left center"/><rect class="cap fo" x="490" y="166" width="64" height="5" rx="2.5" fill="#dde0e8" style="transform-origin:left center"/><g class="fly f2"><rect x="612" y="84" width="108" height="64" rx="4" fill="#5b6ee1" opacity=".85"/><path d="M618 140l18-18 14 12 10-8 28 14z" fill="#fff" opacity=".35"/></g><text class="num" x="612" y="81" font-size="9" font-weight="700" style="fill:#555a6e">Figura 2</text><rect class="cap fo" x="612" y="156" width="100" height="5" rx="2.5" fill="#c9cdd8" style="transform-origin:left center"/><rect class="cap fo" x="612" y="166" width="64" height="5" rx="2.5" fill="#dde0e8" style="transform-origin:left center"/><g class="fly f3"><rect x="490" y="194" width="108" height="64" rx="4" fill="#8fa3ff" opacity=".85"/><path d="M496 250l18-18 14 12 10-8 28 14z" fill="#fff" opacity=".35"/></g><text class="num" x="490" y="191" font-size="9" font-weight="700" style="fill:#555a6e">Figura 3</text><rect class="cap fo" x="490" y="266" width="100" height="5" rx="2.5" fill="#c9cdd8" style="transform-origin:left center"/><rect class="cap fo" x="490" y="276" width="64" height="5" rx="2.5" fill="#dde0e8" style="transform-origin:left center"/><g class="fly f4"><rect x="612" y="194" width="108" height="64" rx="4" fill="#3b5bdb" opacity=".85"/><path d="M618 250l18-18 14 12 10-8 28 14z" fill="#fff" opacity=".35"/></g><text class="num" x="612" y="191" font-size="9" font-weight="700" style="fill:#555a6e">Figura 4</text><rect class="cap fo" x="612" y="266" width="100" height="5" rx="2.5" fill="#c9cdd8" style="transform-origin:left center"/><rect class="cap fo" x="612" y="276" width="64" height="5" rx="2.5" fill="#dde0e8" style="transform-origin:left center"/><text class="num" x="605" y="286" font-size="10" text-anchor="middle" style="fill:#7b8094">3</text></g><g class="badge fo"><rect x="768" y="70" width="156" height="52" rx="12" fill="var(--acc)"/><text x="846" y="102" font-size="20" font-weight="700" text-anchor="middle" style="fill:var(--accc)">PDF</text></g><g class="badge fo" style="animation-delay:.3s"><rect x="768" y="138" width="156" height="52" rx="12" fill="var(--card)" stroke="var(--line)"/><text x="846" y="170" font-size="20" font-weight="700" text-anchor="middle">ZIP + CSV</text></g><g class="badge fo" style="animation-delay:.6s"><rect x="768" y="206" width="156" height="52" rx="12" fill="var(--card)" stroke="var(--line)"/><text x="846" y="238" font-size="17" font-weight="700" text-anchor="middle">Sem GPS</text></g></svg>
