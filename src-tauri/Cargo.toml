[package]
name = "evidencepack"
version = "0.1.0"
description = "Turn screenshots, photos and receipts into an organized PDF report."
authors = ["Yan Suzano"]
license = "MIT"
repository = "https://github.com/yanmfs/evidencepack"
edition = "2021"

[lib]
name = "evidencepack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
percent-encoding = "2"
sha2 = "0.11.1"
imagesize = "0.15.0"
kamadak-exif = "0.6.2"
zip = "9.4.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
lopdf = { version = "0.47.0", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
